<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Web-based recording studio for Opencast" />
    <title>Opencast Studio</title>
    <script>
      let scheme = window.localStorage.getItem("colorScheme");
      const isValid = ["light", "dark", "light-high-contrast", "dark-high-contrast"].includes(scheme);
      if (!isValid) {
        const lightness = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        const contrast = window.matchMedia("(prefers-contrast: more)").matches ? "-high-contrast" : "";
        scheme = `${lightness}${contrast}`;
      }
      document.documentElement.dataset.colorScheme = scheme;
    </script>
    <style>
      /* ----- Define colors and other color-scheme dependent things ----- */
      /* Light mode */
      html[data-color-scheme="light"], html:not([data-color-scheme]) {
        --color-neutral00: #ffffff;
        --color-neutral05: #fefefe;
        --color-neutral10: #f3f3f3;
        --color-neutral15: #e8e8e8;
        --color-neutral20: #dddddd;
        --color-neutral25: #d1d1d1;
        --color-neutral30: #c1c1c1;
        --color-neutral40: #a3a3a3;
        --color-neutral50: #777777;
        --color-neutral60: #575757;
        --color-neutral70: #404040;
        --color-neutral80: #2a2a2a;
        --color-neutral90: #181818;

        --color-danger0: #feedeb;
        --color-danger1: #ffd2cd;
        --color-danger2: #feaba1;
        --color-danger4: #c22a2c;
        --color-danger5: #880e11;

        --color-accent9: #044a81;
        --color-accent8: #215D99;
        --color-accent7: #3073B8;
        --color-accent6: #3E8AD8;
        --color-accent5: #4DA1F7;
        --color-accent4: #71B4F9;

        --shadow-color: rgba(0, 0, 0, 0.1);
        color-scheme: light;
      }

      /* Dark mode */
      html[data-color-scheme="dark"] {
        --color-neutral00: #111111;
        --color-neutral05: #1a1a1a;
        --color-neutral10: #222222;
        --color-neutral15: #2d2d2d;
        --color-neutral20: #383838;
        --color-neutral25: #434343;
        --color-neutral30: #4e4e4e;
        --color-neutral40: #666666;
        --color-neutral50: #7f7f7f;
        --color-neutral60: #999999;
        --color-neutral70: #b3b3b3;
        --color-neutral80: #cccccc;
        --color-neutral90: #e6e6e6;

        --color-danger0: #e3263f;
        --color-danger1: #be182e;
        --color-danger2: #a01426;
        --color-danger4: #d41b34;
        --color-danger5: #ff4d64;

        --color-accent9: #7CA2D5;
        --color-accent8: #6E92C3;
        --color-accent7: #6284B1;
        --color-accent6: #3F597C;
        --color-accent5: #304A69;
        --color-accent4: #1E2F45;

        --shadow-color: rgba(0, 0, 0, 0.3);
        --color-focus: #B8D9FC;
        color-scheme: dark;
      }

      html[data-color-scheme="light-high-contrast"] {
        --color-neutral00: #fff;
        --color-neutral05: #fff;
        --color-neutral10: #fff;
        --color-neutral15: #fff;
        --color-neutral20: #000;
        --color-neutral25: #000;
        --color-neutral30: #000;
        --color-neutral40: #000;
        --color-neutral50: #000;
        --color-neutral60: #000;
        --color-neutral70: #000;
        --color-neutral80: #000;
        --color-neutral90: #000;

        --color-danger0: #fff;
        --color-danger1: #fff;
        --color-danger2: #a50613;
        --color-danger4: #a50613;
        --color-danger5: #a50613;

        --color-accent9: #000099;
        --color-accent8: #000099;
        --color-accent7: #000099;
        --color-accent6: #000099;
        --color-accent5: #000099;
        --color-accent4: #000099;

        --color-focus: #000099;
        color-scheme: light;
      }

      html[data-color-scheme="dark-high-contrast"] {
        --color-neutral00: #000;
        --color-neutral05: #000;
        --color-neutral10: #000;
        --color-neutral15: #000;
        --color-neutral20: #E0E0E0;
        --color-neutral25: #E0E0E0;
        --color-neutral30: #E0E0E0;
        --color-neutral40: #E0E0E0;
        --color-neutral50: #E0E0E0;
        --color-neutral60: #E0E0E0;
        --color-neutral70: #E0E0E0;
        --color-neutral80: #E0E0E0;
        --color-neutral90: #E0E0E0;

        --color-danger0: #000;
        --color-danger1: #000;
        --color-danger2: #00FFFF;
        --color-danger4: #00FFFF;
        --color-danger5: #00FFFF;

        --color-accent9: #FFFF00;
        --color-accent8: #FFFF00;
        --color-accent7: #FFFF00;
        --color-accent6: #FFFF00;
        --color-accent5: #FFFF00;
        --color-accent4: #FFFF00;

        --color-focus: #FFFF00;
        color-scheme: dark;
      }


      /* ----- Some global styles ----- */
      html, body {
          margin: 0;
          padding: 0;
          background-color: var(--color-neutral10);
          color: var(--color-neutral90);
      }


      /* ----- Styles for the initial loading indicator ----- */
      @keyframes loading-rotation {
        0% { transform: rotate(0); }
        100% { transform: rotate(360deg); }
      }
      .loading-indicator {
        width: 100vw;
        height: 100vh;
        justify-content: center;
        align-items: center;
        display: flex;
      }
      .loading-indicator > svg {
        max-width: 90px;
        max-height: 90px;
        width: 30vw;
        height: 30vh;
        animation: 2s linear infinite none loading-rotation;
      }
      .loading-indicator > svg > circle {
        fill: none;
        stroke: var(--color-neutral5);
        stroke-width: 10;
        stroke-dasharray: 167; /* 2/3 of circumference */
        stroke-linecap: round;
      }
    </style>
    <link rel="stylesheet" href="./font.css">
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <!-- Loading indicator, shown until React starts rendering -->
      <div class="loading-indicator">
        <svg viewbox="0 0 100 100">
          <circle cx="50"cy="50"r="40" />
        </svg>
      </div>
    </div>
  </body>
</html>
